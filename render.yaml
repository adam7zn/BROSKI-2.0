services:
  - type: web
    name: math-study-companion
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @math-study-companion/api build
    startCommand: pnpm db:migrate && pnpm --filter @math-study-companion/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_REPOSITORY
        value: postgresql
      - key: CONVERSATION_AGENT_PROVIDER
        value: anthropic
      - key: MSC_MODEL
        value: claude-sonnet-5
      - key: SCREEN_RECORDING_DEMO_ENABLED
        value: 'false'
      - key: SENDBLUE_API_BASE_URL
        value: https://api.sendblue.co
      - key: MESSAGING_LIVE_ENABLED
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: SENDBLUE_API_KEY_ID
        sync: false
      - key: SENDBLUE_API_SECRET_KEY
        sync: false
      - key: SENDBLUE_FROM_NUMBER
        sync: false
      - key: SENDBLUE_RECIPIENT_NUMBER
        sync: false
      - key: SENDBLUE_WEBHOOK_SECRET
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
